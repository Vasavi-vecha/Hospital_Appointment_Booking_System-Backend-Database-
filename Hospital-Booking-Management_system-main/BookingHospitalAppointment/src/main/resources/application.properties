# Database connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_db_}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# MySQL driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=${PORT:8080}

# Spring AI - Chatbot (set OPENAI_API_KEY as an environment variable with your real key)
spring.ai.openai.api-key=${OPENAI_API_KEY:demo-key-replace-me}
spring.ai.openai.chat.options.model=gpt-4o-mini

# Appointment booking slots (24-hour HH:mm, comma separated)
booking.slots=09:00,10:00,11:00,12:00,14:00,15:00,16:00

# JWT
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-please}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Admin seed (used once at startup if no admin exists yet)
admin.email=${ADMIN_EMAIL:admin@hospital.com}
admin.password=${ADMIN_PASSWORD:admin123}
