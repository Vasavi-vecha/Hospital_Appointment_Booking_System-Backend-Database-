# Database connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_db_}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:5218}

# MySQL driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=${PORT:8080}

# Spring AI - Chatbot (set OPENAI_API_KEY as an environment variable with your real key)
spring.ai.openai.api-key=${OPENAI_API_KEY:demo-key-replace-me}
spring.ai.openai.chat.options.model=gpt-4o-mini
